<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Camera measurement">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#4A7C8F"/>
    </linearGradient>
    <clipPath id="lens-clip">
      <circle cx="60" cy="68" r="22"/>
    </clipPath>
  </defs>

  <!-- Camera body: x=12 y=28 w=96 h=64 rx=12 — corners at (12,28),(108,28),(108,92),(12,92) -->
  <rect x="12" y="28" width="96" height="64" rx="12" fill="#FFFDF8" stroke="#1B3A4B" stroke-width="3.5"/>

  <!-- Viewfinder hump on top (centered at x=60) -->
  <path fill="#1B3A4B"
    d="M44,22 Q44,28 52,28 L68,28 Q76,28 76,22 L74,16 Q74,12 70,12 L50,12 Q46,12 46,16 Z"/>

  <!-- Shutter button (top right area) -->
  <circle cx="92" cy="20" r="6" fill="url(#cg)"/>
  <circle cx="92" cy="20" r="3.5" fill="#EEC639"/>

  <!-- Lens outer ring -->
  <circle cx="60" cy="68" r="26" fill="#E8F0F4" stroke="#1B3A4B" stroke-width="2.5"/>
  <!-- Lens glass -->
  <circle cx="60" cy="68" r="20" fill="#C8DDE8" stroke="#4A7C8F" stroke-width="1.5"/>
  <!-- Lens reflective highlight -->
  <circle cx="68" cy="60" r="4" fill="white" opacity=".55"/>

  <!-- Viewfinder scan corners — precisely at camera rect corners (12,28)(108,28)(108,92)(12,92)
       Inset 6px → corner brackets at (18,34)(102,34)(102,86)(18,86), length 14px -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5">
    <!-- TL: (18,34) -->
    <polyline stroke="#D4A017" points="18,48 18,34 32,34">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s"
        keyTimes="0;0.5;1" repeatCount="indefinite"/>
    </polyline>
    <!-- TR: (102,34) -->
    <polyline stroke="#D4A017" points="88,34 102,34 102,48">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s"
        keyTimes="0;0.5;1" begin="0.35s" repeatCount="indefinite"/>
    </polyline>
    <!-- BL: (18,86) -->
    <polyline stroke="#D4A017" points="18,72 18,86 32,86">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s"
        keyTimes="0;0.5;1" begin="0.2s" repeatCount="indefinite"/>
    </polyline>
    <!-- BR: (102,86) -->
    <polyline stroke="#D4A017" points="88,86 102,86 102,72">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s"
        keyTimes="0;0.5;1" begin="0.5s" repeatCount="indefinite"/>
    </polyline>
  </g>

  <!-- Flash burst (periodic) -->
  <circle cx="60" cy="68" r="28" fill="#EEC639" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.35;0" dur="3.5s"
      keyTimes="0;0.8;0.87;0.91;0.97" repeatCount="indefinite"/>
    <animate attributeName="r" values="22;22;22;30;22" dur="3.5s"
      keyTimes="0;0.8;0.87;0.91;0.97" repeatCount="indefinite"/>
  </circle>
</svg>
