<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="rg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEC639"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>
    <linearGradient id="rg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A7C8F"/>
      <stop offset="100%" stop-color="#2D5A3D"/>
    </linearGradient>
    <linearGradient id="rg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A3D"/>
      <stop offset="100%" stop-color="#8FAE7E"/>
    </linearGradient>
    <!-- Avatar clip paths -->
    <clipPath id="ac1"><circle cx="98"  cy="90"  r="44"/></clipPath>
    <clipPath id="ac2"><circle cx="190" cy="112" r="30"/></clipPath>
    <clipPath id="ac3"><circle cx="58"  cy="140" r="22"/></clipPath>
  </defs>

  <!-- Story ring 1 — large, gold, floats -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-7; 0,0" dur="4s" keyTimes="0;0.5;1"
      calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
      repeatCount="indefinite"/>
    <circle cx="98" cy="90" r="50" fill="none" stroke="url(#rg1)" stroke-width="4.5"/>
    <!-- Avatar bg -->
    <circle cx="98" cy="90" r="44" fill="#EDE6D6" clip-path="url(#ac1)"/>
    <!-- Person silhouette -->
    <g clip-path="url(#ac1)">
      <circle cx="98" cy="78" r="15" fill="#4A7C8F"/>
      <ellipse cx="98" cy="120" rx="28" ry="22" fill="#4A7C8F"/>
    </g>
    <!-- "+" add button on ring border (bottom-right of ring) -->
    <circle cx="136" cy="128" r="13" fill="#D4A017" stroke="#FFFDF8" stroke-width="3"/>
    <line x1="130" y1="128" x2="142" y2="128" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="136" y1="122" x2="136" y2="134" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Story ring 2 — medium, steel blue, floats offset -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-5; 0,0" dur="3.4s" keyTimes="0;0.5;1"
      calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
      begin="0.5s" repeatCount="indefinite"/>
    <circle cx="190" cy="112" r="36" fill="none" stroke="url(#rg2)" stroke-width="4"/>
    <circle cx="190" cy="112" r="30" fill="#E8F4F4" clip-path="url(#ac2)"/>
    <g clip-path="url(#ac2)">
      <circle cx="190" cy="102" r="11" fill="#2D5A3D"/>
      <ellipse cx="190" cy="134" rx="22" ry="18" fill="#2D5A3D"/>
    </g>
    <!-- Notification dot -->
    <circle cx="216" cy="86" r="8" fill="#EEC639" stroke="#FFFDF8" stroke-width="2.5"/>
    <line x1="212" y1="86" x2="220" y2="86" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="216" y1="82" x2="216" y2="90" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Story ring 3 — small, forest green, floats offset -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-4; 0,0" dur="5s" keyTimes="0;0.5;1"
      calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
      begin="1.1s" repeatCount="indefinite"/>
    <circle cx="58" cy="140" r="28" fill="none" stroke="url(#rg3)" stroke-width="3.5"/>
    <circle cx="58" cy="140" r="22" fill="#EDE6D6" clip-path="url(#ac3)"/>
    <g clip-path="url(#ac3)">
      <circle cx="58" cy="131" r="9" fill="#2D5A3D"/>
      <ellipse cx="58" cy="156" rx="17" ry="14" fill="#2D5A3D"/>
    </g>
  </g>
</svg>
