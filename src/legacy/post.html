<style>
  #pb-share {
    --ink: oklch(24% 0.04 224);
    --water: oklch(18% 0.035 224);
    --foam: oklch(96% 0.012 85);
    --mute: oklch(78% 0.02 85);
    --gold: oklch(73% 0.13 83);
    --gold-ink: oklch(22% 0.04 83);
    --line: oklch(32% 0.03 224);
    box-sizing: border-box;
    width: min(420px, 100%);
    margin: 36px auto;
    overflow: hidden;
    border-radius: 28px;
    background: var(--water);
    color: var(--foam);
    font-family: Montserrat, Arial, sans-serif;
    box-shadow: 0 22px 50px oklch(18% 0.04 224 / 0.28);
  }
  #pb-share *, #pb-share *::before, #pb-share *::after { box-sizing: border-box; }
  #pb-share .media {
    position: relative;
    min-height: 280px;
    background:
      radial-gradient(120% 80% at 50% 0%, oklch(28% 0.04 224), transparent 55%),
      var(--water);
  }
  #pb-share .media img#pb-photo {
    display: none;
    width: 100%;
    height: 340px;
    object-fit: cover;
  }
  #pb-share .media.is-ready img#pb-photo { display: block; }
  #pb-share .shade {
    position: absolute;
    inset: auto 0 0;
    height: 46%;
    background: linear-gradient(180deg, transparent, oklch(16% 0.035 224 / 0.92));
    pointer-events: none;
  }
  #pb-share .mark {
    position: absolute;
    top: 14px;
    left: 14px;
    width: 34px;
    height: 34px;
    padding: 6px;
    object-fit: contain;
    border-radius: 11px;
    background: oklch(96% 0.012 85 / 0.92);
  }
  #pb-share .byline {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #pb-share .avatar,
  #pb-share .avatar-fallback {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    flex: 0 0 40px;
  }
  #pb-share .avatar { display: none; object-fit: cover; }
  #pb-share .avatar-fallback {
    display: grid;
    place-items: center;
    background: var(--gold);
    color: var(--gold-ink);
    font-size: 15px;
    font-weight: 800;
  }
  #pb-share .byline strong {
    display: block;
    font-size: 15px;
    font-weight: 800;
    line-height: 1.2;
  }
  #pb-share .byline span {
    display: block;
    margin-top: 2px;
    color: var(--mute);
    font-size: 12px;
    font-weight: 600;
  }
  #pb-share .body { padding: 22px 20px 20px; }
  #pb-share h2 {
    margin: 0 0 8px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.2;
  }
  #pb-share .caption {
    margin: 0;
    max-width: 38ch;
    color: oklch(90% 0.015 85);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.5;
  }
  #pb-share .stats {
    display: none;
    gap: 18px;
    margin: 16px 0 0;
    color: var(--mute);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  #pb-share .stats b { color: var(--foam); font-weight: 800; }
  #pb-share .cta {
    display: block;
    margin-top: 20px;
    padding: 15px 16px;
    border-radius: 16px;
    background: var(--gold);
    color: var(--gold-ink);
    font-size: 15px;
    font-weight: 800;
    text-align: center;
    text-decoration: none;
  }
  #pb-share .store {
    display: block;
    margin-top: 12px;
    color: var(--mute);
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
  }
  #pb-share .cta:focus-visible,
  #pb-share .store:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 3px;
  }
</style> <article id="pb-share"> <div class="media" id="pb-photo-wrap"> <img id="pb-photo" alt=""> <div class="shade"></div> <img class="mark" src="/brand/pb-logo-192.png" alt="PB Fishing"> <div class="byline" id="pb-author"> <div class="avatar-fallback" id="pb-avatar-fallback">P</div> <img class="avatar" id="pb-avatar" alt=""> <div> <strong id="pb-author-name">PB Fishing</strong> <span>shared a catch</span> </div> </div> </div> <div class="body"> <h2 id="pb-title">A catch on PB Fishing</h2> <p class="caption" id="pb-caption">Open this link in the app to see the full post.</p> <div class="stats" id="pb-stats"></div> <a class="cta" id="pb-open-app" href="pbfishing://community">Open in PB Fishing</a> <a class="store" href="https://apps.apple.com/us/app/pb-fishing-catch-compete/id6773752665">Get the app</a> </div> </article> <script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var id = (params.get("id") || "").trim();
    var deep = id
      ? "pbfishing://community/post/" + encodeURIComponent(id)
      : "pbfishing://community";
    var btn = document.getElementById("pb-open-app");
    if (btn) btn.href = deep;

    function fmt(n) {
      n = Number(n) || 0;
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
      if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
      return String(n);
    }

    function tryOpenApp() {
      if (!id || !/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) return;
      var frame = document.createElement("iframe");
      frame.style.display = "none";
      frame.src = deep;
      document.body.appendChild(frame);
      setTimeout(function () { frame.remove(); }, 2000);
    }

    if (!id) return;
    tryOpenApp();

    fetch("https://xbmbasqajkfexgrhqmzv.supabase.co/functions/v1/post-preview?id=" + encodeURIComponent(id))
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (post) {
        if (!post) return;
        var name = post.author_name || "Angler";
        document.getElementById("pb-author-name").textContent = name;
        document.getElementById("pb-avatar-fallback").textContent = name.charAt(0).toUpperCase();

        if (post.author_avatar) {
          var avatar = document.getElementById("pb-avatar");
          avatar.src = post.author_avatar;
          avatar.onload = function () {
            avatar.style.display = "block";
            document.getElementById("pb-avatar-fallback").style.display = "none";
          };
        }

        if (post.image_url) {
          var photo = document.getElementById("pb-photo");
          photo.src = post.image_url;
          photo.alt = name + " shared a catch";
          photo.onload = function () {
            document.getElementById("pb-photo-wrap").classList.add("is-ready");
          };
        }

        var caption = (post.caption || "").trim();
        var title = document.getElementById("pb-title");
        if (caption) {
          title.style.display = "none";
          document.getElementById("pb-caption").textContent = caption;
        } else {
          title.textContent = name + " shared a catch";
          document.getElementById("pb-caption").textContent = "Open it in PB Fishing to like, comment, or save.";
        }

        var stats = document.getElementById("pb-stats");
        stats.style.display = "flex";
        stats.textContent = "";
        [
          [fmt(post.likes_count), "likes"],
          [fmt(post.comments_count), "comments"]
        ].forEach(function (item) {
          var el = document.createElement("span");
          var num = document.createElement("b");
          num.textContent = item[0];
          el.appendChild(num);
          el.appendChild(document.createTextNode(" " + item[1]));
          stats.appendChild(el);
        });
      })
      .catch(function () {});
  })();
</script>
